<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Random Useless Facts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Random Useless Facts</h1>
        <p>Discover something surprisingly unnecessary today!</p>
      </header>

      <main>
        <div class="card">
          <div id="factOutput" class="fact-text">
            Your random fact will appear here...
          </div>
          <button id="factBtn" class="pulse">Get a Fact</button>
        </div>
      </main>

      <footer>
        <p>
          Powered by the
          <a href="https://uselessfacts.jsph.pl/" target="_blank"
            >Useless Facts API</a
          >
        </p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
